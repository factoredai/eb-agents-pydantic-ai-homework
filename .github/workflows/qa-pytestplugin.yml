name: CI Pytest Plugin

on:
  pull_request:
    branches: [main]
    paths:
      - '.vocareum/pytestplugin/**'
      - '.github/workflows/qa-pytestplugin.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .vocareum/pytestplugin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"

      - name: Set up uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Setup uv venv
        run: make setup

      - name: Install dev dependencies
        run: make dev

      - name: Run quality checks
        run: make check

      - name: Run test coverage
        run: make coverage
